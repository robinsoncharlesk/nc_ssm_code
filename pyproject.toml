[project]
name = "ada-oracle"
version = "0.1.0"
description = "Ask modern tech questions and get responses from Hidden Histories pioneers"
authors = [{name = "Ada Oracle Team"}]
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "click>=8.1.0",
    "rich>=13.0.0",
]

[project.scripts]
ada-oracle = "ada_oracle.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ada_oracle"]
